aid: tonal
name: Tonal
description: 'Tonal is a connected fitness company founded in 2013 by Aly Orady and
  headquartered in San Francisco, best known for its wall-mounted smart home gym that
  uses digital weight (electromagnetic resistance) and AI-powered coaching to deliver
  personalized strength training. The Tonal 2 hardware pairs with a subscription
  membership offering adaptive weight adjustment, science-backed workout programs,
  live and on-demand classes, and progress tracking. Tonal publishes no first-party
  developer API, but its Shopify-hosted storefront exposes an agent-commerce surface:
  an llms.txt, a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp,
  and an MCP endpoint for agent-driven shopping.'
